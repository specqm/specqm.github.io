<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign title_key = page.section | append: '_title' %}
  {% assign page_heading = t[title_key] | default: t.home %}
  <title>{{ page_heading | escape }} · {{ group.name[lang] | escape }} · {{ t.university | escape }}</title>
  <meta name="description" content="{{ group.intro[lang] | strip_html | escape }}">
  <meta name="theme-color" content="#102e3e">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}?v=2" sizes="16x16 32x32 48x48 64x64" type="image/x-icon">
  <link rel="icon" href="{{ '/favicon.png' | relative_url }}?v=2" sizes="192x192" type="image/png">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}?v=2" sizes="any" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}" sizes="180x180">
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="{{ t.code }}" href="{{ page.url | absolute_url }}">
  {% if page.alternate %}<link rel="alternate" hreflang="{% if lang == 'en' %}zh-CN{% else %}en{% endif %}" href="{{ page.alternate | absolute_url }}">{% endif %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ group.name[lang] | escape }} · {{ t.university | escape }}">
  <meta property="og:description" content="{{ group.intro[lang] | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <script>document.documentElement.classList.add('js');</script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
