title: 北京师范大学量子材料散射谱学课题组
description: 北京师范大学量子材料散射谱学课题组，PI 鲁兴业教授。BNU-SpecQM, Beijing Normal University.
lang: zh-CN
url: "https://specqm.github.io"
baseurl: ""
timezone: Asia/Shanghai

include:
  - _pages

exclude:
  - README.md
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - workspace
  - scratch
  - scripts

sass:
  sass_dir: _sass

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true
