research:
  intro:
    zh: 研究组拥有设施先进的样品生长和表征实验室，主要采用输运、中子散射和共振非弹性 X 射线散射研究关联电子材料中的量子态、演生序及其相关涨落。结合多种实验和表征手段，我们研究新奇关联电子材料的结构、有序相和动力学。
    en: Our group has advanced facilities for sample growth and characterization. We use transport measurements,
      neutron scattering and resonant inelastic X-ray scattering to study quantum states, emergent orders and their
      associated fluctuations in correlated electron materials. By combining these experimental and characterization
      techniques, we investigate their structure, ordered phases and dynamics.
  collaborations:
    zh: 学生有机会赴欧洲和美国的中子源、同步辐射光源开展实验，与国际科学家交流学习。依托研究组与美国莱斯大学、瑞士保罗谢勒研究所建立的长期合作关系，学生也有长期出国访问交流的机会。
    en: Students have opportunities to carry out experiments at neutron and synchrotron sources in Europe and the
      USA and to work with international scientists. Long-standing collaborations with Rice University and the Paul
      Scherrer Institute also provide opportunities for extended research visits abroad.
  topics:
  - title:
      zh: 高温超导体
      en: High-temperature superconductors
    description:
      zh: 研究材料包括铁基和铜氧化物高温超导体，关注关联电子材料中的量子态、演生序及其相关涨落。
      en: Our materials include iron-based and cuprate high-temperature superconductors. We investigate quantum
        states, emergent orders and their fluctuations in these correlated electron systems.
  - title:
      zh: 量子磁性与量子自旋液体
      en: Quantum magnetism and quantum spin liquids
    description:
      zh: 研究材料包括低维量子磁体和量子自旋液体，结合多种实验手段研究其结构、有序相与动力学。
      en: Our materials include low-dimensional quantum magnets and quantum spin liquids. We combine complementary
        experiments to study their structure, ordered phases and dynamics.
  - title:
      zh: 5d 过渡金属氧化物
      en: 5d transition-metal oxides
    description:
      zh: 研究材料包括 5d 过渡金属氧化物，例如铱氧化物。通过中子散射与共振非弹性 X 射线散射等方法探测相关激发。
      en: Our materials include 5d transition-metal oxides, such as iridates. Neutron scattering, resonant inelastic
        X-ray scattering and complementary techniques probe their excitations.
  - title:
      zh: 样品生长、表征与散射谱学
      en: Crystal growth, characterization and scattering spectroscopy
    description:
      zh: 在实验室开展样品生长、表征和输运测量；中子散射和共振非弹性 X 射线散射实验一般在欧洲和美国的中子源、同步辐射光源开展。
      en: We grow and characterize samples and perform transport measurements in our laboratories. Neutron scattering
        and resonant inelastic X-ray scattering experiments are generally performed at neutron and synchrotron sources
        in Europe and the USA.
  projects:
  - period: 2021.12–2026.11
    text:
      zh: 科技部“物态调控”重点研发计划，605 万元，课题主持。
      en: Ministry of Science and Technology key R&D program on regulation of states of matter; RMB 6.05 million;
        subproject leader.
  - period: 2024.01–2025.12
    text:
      zh: 北京师范大学“优秀青年创新团队”项目，400 万元，项目骨干。
      en: Beijing Normal University “Outstanding Young Innovation Team” project; RMB 4.00 million; core team member.
  - period: 2022.01–2025.12
    text:
      zh: 国家自然科学基金面上项目，61 万元，主持。
      en: National Natural Science Foundation of China (NSFC) General Program; RMB 610,000; Principal Investigator.
  - period: 2020.01–2022.12
    text:
      zh: 国家自然科学基金优秀青年科学基金，主持。
      en: NSFC Excellent Young Scientists Fund; Principal Investigator.
  - period: 2018.01–2022.12
    text:
      zh: 国家自然科学基金重点项目，参与。
      en: NSFC Key Program; participant.
