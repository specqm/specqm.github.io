name:
  zh: 量子材料散射谱学课题组
  en: BNU-SpecQM
intro:
  zh: 我们是由鲁兴业教授领导的北京师范大学量子材料散射谱学课题组。
  en: We are BNU-SpecQM, the quantum materials scattering spectroscopy group at Beijing Normal University led by
    Professor Xingye Lu.
pi:
  name:
    zh: 鲁兴业
    en: Xingye Lu
  title:
    zh: 教授 · 博士生导师 · 课题组 PI
    en: Professor · Doctoral supervisor · Principal Investigator
  photo: /assets/images/xingye-lu.jpg
  biography:
    zh: 鲁兴业，北京师范大学教授、博士生导师，量子材料散射谱学课题组 PI。2008 年获河北大学理学学士学位，2014 年获中国科学院物理研究所理学博士学位；曾在美国田纳西大学、莱斯大学和瑞士保罗谢勒研究所开展访问与博士后研究。2017
      年加入北京师范大学物理学系／高等量子研究中心，研究关联电子材料的结构、有序相与动力学。
    en: Xingye Lu is a professor and doctoral supervisor at Beijing Normal University, where he leads BNU-SpecQM.
      He received a B.Sc. from Hebei University in 2008 and a Ph.D. in Science from the Institute of Physics, Chinese
      Academy of Sciences, in 2014. He held visiting and postdoctoral positions at the University of Tennessee,
      Rice University and the Paul Scherrer Institute before joining BNU’s Department of Physics / Center for Advanced
      Quantum Studies in 2017. His research concerns the structure, ordered phases and dynamics of correlated electron
      materials.
  email: luxy@bnu.edu.cn
  phone: +86-10-58806525
