recruitment:
  zh: 欢迎对量子材料与散射谱学感兴趣的同学申请硕士、博士研究生，或参与本科生科研训练。课题组开展样品生长、物性表征、输运测量、中子散射和共振非弹性 X 射线散射研究，并依托与莱斯大学、保罗谢勒研究所的长期合作开展国际交流。如需了解研究方向和培养安排，请联系鲁兴业教授：[luxy@bnu.edu.cn](mailto:luxy@bnu.edu.cn)。
  en: We welcome applications for master’s and Ph.D. study, as well as undergraduate participation in research.
    BNU-SpecQM combines sample growth, materials characterization, transport measurements, neutron scattering and
    resonant inelastic X-ray scattering, with international exchange through long-standing collaborations with Rice
    University and the Paul Scherrer Institute. To discuss research interests and training, please contact Professor
    Xingye Lu at [luxy@bnu.edu.cn](mailto:luxy@bnu.edu.cn).
